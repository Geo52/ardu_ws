controller_server:
  ros__parameters:
    # TODO: enable when navigation2 supports twist stamped
    # enable_stamped_cmd_vel: True
    use_sim_time: *default_use_sim_time
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # A multicopter under GUIDED velocity control accelerates and
      # turns far more slowly than the ground robots these defaults
      # assume, so the stock 0.5 m / 10 s trips constantly and sends
      # the vehicle into recovery spins.
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # The lidar is 360 degrees, so the vehicle senses the same thing
      # whichever way it faces: demanding a final heading buys nothing
      # and costs a slow yaw manoeuvre the copter often cannot complete
      # within tolerance. It then never registers arrival, the progress
      # checker trips, and the goal dies after a cycle of recoveries.
      # Heading is therefore unconstrained.
      #
      # The goal is likewise a region, not a pose: stopping half a
      # metre from a frontier still lets the lidar see past it.
      xy_goal_tolerance: 1.5
      yaw_goal_tolerance: 3.15
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # 0.4 m/s repeatedly clipped corners in 1.2-2 m corridors. DWB
      # is a ground-robot controller and does not model the copter's
      # momentum, so the practical remedy is time to react. Slower
      # runs, but coverage is limited by sensing rather than speed.
      max_vel_x: 0.7
      max_vel_y: 0.7
      max_vel_theta: 1.0
      max_speed_xy: 0.8
      # DWB plans assuming it gets the acceleration it asks for. At
      # 2.5 m/s2 it planned turns this copter cannot track under
      # GUIDED velocity control, so it overshot and clipped the *edge*
      # of a wall -- rounding a convex corner leaves no inflation band
      # to absorb the error, unlike running alongside a flat wall.
      # 1.0 makes DWB plan turns the vehicle can actually fly.
      acc_lim_x: 2.5
      # A quadcopter is holonomic and can strafe. The upstream config
      # left lateral acceleration at 0, which describes a
      # differential-drive ground robot: DWB could then never sample a
      # sideways trajectory, so every corner became stop-yaw-go, and
      # yaw under GUIDED velocity control is slow enough that the
      # vehicle visibly hangs at each turn.
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Every critic defaults to scale 1.0, which leaves obstacle
      # avoidance (BaseObstacle, one critic) outvoted by four critics
      # all pulling toward the goal. The copter clipped the same wall
      # edge near (5, 2) in several runs. Weight avoidance above
      # path-following; too high and it refuses to enter corridors, so
      # this is deliberately below the goal critics' combined pull.
      # BaseObstacle.scale left at default: raising it was part of the
      # controller changes that coincided with edge strikes.

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: *default_use_sim_time
      robot_radius: 0.35
      resolution: 0.05
      # Unknown cells are recorded as NO_INFORMATION rather than being
      # written into the costmap as FREE_SPACE.
      #
      # This is the fix for "it's routing through walls" (entry 28),
      # and the symptom named the wrong thing. Sampling the live /plan
      # against /map, twice, months apart:
      #
      #   run 74:  544 poses -- 0 through known wall, 221 unknown
      #   later : 1306 poses -- 0 through known wall, 392 unknown
      #
      # Not one pose ever crossed a wall the map knew about. At the
      # default false, unknown is written as FREE_SPACE 0, so the
      # planner is not defying a wall -- it is being told the
      # unexplored maze is confirmed-empty floor, and it draws
      # confident straight lines across it. Where a wall happens to
      # stand in one, the path crosses it, which on screen is
      # indistinguishable from ignoring a wall it can see. This is why
      # raising occupied_min never fixed it: the threshold was never
      # the thing being consulted.
      #
      # Must stay paired with the planner's allow_unknown: true, which
      # is inert until this is set -- there is no NO_INFORMATION in the
      # costmap for it to permit. Together they make unknown expensive
      # rather than forbidden: navfn maps free to COST_NEUTRAL 50 and
      # unknown-with-allow_unknown to COST_OBS-1 = 253, so a known-free
      # detour is preferred up to ~5x the length, while a frontier goal
      # on the unknown boundary -- where every frontier goal sits by
      # definition -- stays reachable. Setting this without
      # allow_unknown strands the vehicle, which is the run-71 failure
      # in a new form and the reason entry 28 was left open.
      track_unknown_space: true
      # Occupancy at or above which a map cell becomes a lethal obstacle.
      #
      # This was 50, which is below Cartographer's fog. Measured on run
      # 71's final map: real walls occupy 90-100 (3839 cells), while
      # 26-89 is the partially-observed band Cartographer leaves around
      # everything it has not resolved (10068 cells). At 50 two thirds
      # of what the costmap called wall was fog, and inflation_radius
      # 1.0 painted a 1 m halo around every one of them -- 47945 cells
      # at inscribed cost 99, against 11401 genuinely lethal.
      #
      # The effect is a planner that refuses freshly explored ground:
      # run 71 logged 28 x "failed to create plan" and aborted 13 of 49
      # goals, each one sitting at cost 99 in the costmap while reading
      # free in the map, and landed with a third of the south-east
      # quadrant visible but unplannable. Replaying that map, the goals
      # Nav2 refused go from 0/4 reachable at 50 to 4/4 at 90, and the
      # plannable area from 244.0 m2 to 268.6 m2.
      #
      # Note the failure gets worse the better exploration works: fog is
      # what a map is made of before it settles, so pushing hard into
      # new ground is exactly what fills the costmap with false walls.
      #
      # 90 was the first correction and overshot. A wall seen only at
      # distance or at a grazing angle has not yet reached 90, so the
      # planner cannot see it -- and the consequence is not merely a
      # collision risk. A straight line through a wall the costmap
      # reads as free is *cheaper* than the way round, so the planner
      # prefers it, hands the controller a route the vehicle cannot
      # fly, and the goal burns its 90 s timeout and is blacklisted.
      # Runs 72 and 73 both showed it; in 73 it cost the last region of
      # the maze, which sat reachable and unvisited while the planner
      # kept proposing a shortcut through the wall beside it.
      #
      # So an under-believed wall loses coverage in the same way an
      # over-believed one does, just later and with a crash risk
      # attached. 80 was tried next and run 74 still routed through
      # walls, which prompted measuring the thing all three values were
      # guessing at. Taking run 72's mid-run map and its final one and
      # asking what each fog cell became:
      #
      #   fog band   cells   -> free   -> wall   unresolved
      #     26-49     2231      73%       3%        24%
      #     50-64     3762      40%       7%        53%
      #     65-79     1555      33%      18%        50%
      #     80-89     1351      36%      19%        45%
      #
      # No value in that band separates the two. Even at 80-89, the
      # most wall-like fog there is, a cell is nearly twice as likely
      # to resolve free as to resolve wall. Occupancy alone cannot
      # decide this, so 50, 80 and 90 all had to fail, each in its own
      # direction.
      #
      # Hence 90 here and the ranges on the obstacle layer above: let
      # the static layer believe only what has consolidated, and let
      # live scans mark what the lidar is looking at right now. On this
      # data 90 is the better-calibrated static threshold; it was only
      # dangerous while nothing else was marking walls at all.
      lethal_cost_threshold: 90
      always_send_full_costmap: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Without these, Nav2's defaults apply -- obstacle_max_range
          # 2.5 m and raytrace_max_range 3.0 m -- so a 30 m lidar was
          # marking obstacles only within 2.5 m of the vehicle. Beyond
          # that the planner knew about walls solely through the static
          # layer, i.e. through Cartographer's occupancy, where a wall
          # the vehicle has merely glimpsed is still fog and no lethal
          # threshold can classify it (see the table below).
          #
          # That is what "it routes through walls" was: not a threshold
          # set too high, but a planner with no live obstacle data past
          # 2.5 m, confidently drawing a straight line through geometry
          # it could see perfectly well but was not being told about.
          #
          # Marking at sensor range replaces a probability guess with
          # an observation: if the beam terminates there now, it is a
          # wall now, whatever the map's confidence has settled on.
          obstacle_max_range: 20.0
          raytrace_max_range: 25.0
          # ...and the ranges alone did nothing, because the height
          # filter was discarding every point before range mattered.
          #
          # Nav2 defaults to min_obstacle_height 0.0 / max_obstacle
          # _height 2.0, applied to the observation's z in the costmap
          # frame. That is written for a ground robot whose lidar sits
          # at 0.2 m. This one flies at takeoff_alt, 2.0 m, so its scan
          # projects to z ~= 2.0 -- exactly the ceiling -- and every
          # point was dropped. Measured on run 75: cells lethal in the
          # costmap but not wall in the static map, i.e. everything the
          # obstacle layer contributed, came to precisely zero.
          #
          # A flying vehicle's scan height is its altitude, which is a
          # parameter, so any fixed window is wrong the moment someone
          # changes takeoff_alt. Open it wide instead: the 2D lidar
          # only reports what it can see anyway.
          min_obstacle_height: -5.0
          max_obstacle_height: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Radius stays wide so planned paths prefer corridor centres,
        # but the cost must decay fast or the whole corridor becomes
        # expensive and the controller freezes. Measured: a vehicle at
        # 0.75 m clearance saw cost 76/253 at scaling 3.0 and could not
        # find an affordable escape trajectory. 10.0 fixed that but
        # gutted close-range repulsion (0.55 m: 138 -> 34) and the
        # vehicle struck a wall. 6.0 keeps both: 0.55 m -> 76 still
        # repels, 0.75 m -> 23 still lets it move.
        # Centring: the planner minimises cost, so if the inflation
        # gradients from both walls overlap there is a single cheapest
        # ridge down the corridor centre and the path follows it. At
        # 0.7 m the gradient reached only two thirds of the way in
        # (median corridor half-width here is 1.10 m), leaving a flat
        # uncosted plateau in the middle: the path had no reason to
        # centre and arrived at turns already hugging one side, with
        # no room to swing. 1.0 m overlaps the gradients. Decay stays
        # gentle (3.0) -- steep decay flattens the middle again and
        # destroys the very centring this is for.
        inflation_radius: 1.0
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: *default_use_sim_time
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.35
      always_send_full_costmap: True
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        observation_sources: scan
        scan:
          topic: /scan
          # Was 2.0, which silently discarded every scan point: the
          # vehicle flies at 2.0 m, so its observations sit at the
          # ceiling of the window. Same defect as the global costmap's
          # obstacle layer above, and worse here -- this is the layer
          # the controller uses to avoid hitting things.
          min_obstacle_height: -5.0
          max_obstacle_height: 10.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Radius stays wide so planned paths prefer corridor centres,
        # but the cost must decay fast or the whole corridor becomes
        # expensive and the controller freezes. Measured: a vehicle at
        # 0.75 m clearance saw cost 76/253 at scaling 3.0 and could not
        # find an affordable escape trajectory. 10.0 fixed that but
        # gutted close-range repulsion (0.55 m: 138 -> 34) and the
        # vehicle struck a wall. 6.0 keeps both: 0.55 m -> 76 still
        # repels, 0.75 m -> 23 still lets it move.
        # Centring: the planner minimises cost, so if the inflation
        # gradients from both walls overlap there is a single cheapest
        # ridge down the corridor centre and the path follows it. At
        # 0.7 m the gradient reached only two thirds of the way in
        # (median corridor half-width here is 1.10 m), leaving a flat
        # uncosted plateau in the middle: the path had no reason to
        # centre and arrived at turns already hugging one side, with
        # no room to swing. 1.0 m overlaps the gradients. Decay stays
        # gentle (3.0) -- steep decay flattens the middle again and
        # destroys the very centring this is for.
        inflation_radius: 1.0
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: *default_use_sim_time
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      # Must be true for frontier exploration. Frontier goals sit by
      # definition at the edge of unknown space, so with unknown
      # treated as an obstacle the inflation around it engulfs the
      # goal and NavFn refuses to plan: 10 of 15 goals failed with
      # "Planning algorithm GridBased failed to create plan".
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: *default_use_sim_time
    smoother_plugins: ["simple_smoother"]
    enable_stamped_cmd_vel: True
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    use_sim_time: *default_use_sim_time
    enable_stamped_cmd_vel: True
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: *default_use_sim_time
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.8, 1.0]
    min_velocity: [-0.8, -0.8, -1.0]
    velocity_timeout: 1.0
